services:
  robi:
    build: .
    container_name: robi
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3000
    networks:
      - robi-network

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: robi-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Istanbul
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - robi-network

volumes:
  n8n_data:

networks:
  robi-network:
    driver: bridge
